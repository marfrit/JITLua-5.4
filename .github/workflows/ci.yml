name: ci
on: [push, pull_request]
jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -j$(nproc)
      - run: tests/ref/fetch-ref.sh
      - run: tests/harness.sh --mode all --timeout 120 --strict
      - run: python3 tests/fuzz/fuzz.py --seed 1 --count 500 --mode B --opt-levels 0,1,2,3 --gc
      - run: python3 tests/fuzz/fuzz.py --seed 1 --count 200 --mode R --gc
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: make -j$(nproc)
      - run: tests/ref/fetch-ref.sh
      - run: tests/harness.sh --mode all --timeout 120 --strict
# Sanitizer CI is intentionally not part of the public gate yet: a local
# arm64 ASan+UBSan run is red on pre-existing UBSan reports (lj_bcread.c
# shift) and the differential harness compares sanitizer stack traces across
# arms.  tests/ci-local.sh --sanitizers-only remains available for manual use.
